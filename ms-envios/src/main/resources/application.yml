server:
  port: 8087

spring:
  application:
    name: ms-envios
  datasource:
    url: ACA_VA_TU_URL_DE_SUPABASE
    username: postgres
    password: ACA_VA_TU_PASSWORD
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect